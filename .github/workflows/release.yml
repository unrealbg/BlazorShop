name: release-dryrun-do-not-merge

# DRY RUN ONLY (branch codex/r11-release-dryrun-do-not-merge, never merge). Exercises the R11 guards
# against the real GitHub API, the real build/checksum/attestation path and attestation verification.
# It creates no tag and no release; the publish job stops before `gh release create`.
# The file keeps the release.yml path so attestations carry the same signer workflow path.

on:
  push:
    branches: [codex/r11-release-dryrun-do-not-merge]

permissions: {}

jobs:
  source-guard-real-api:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Source guards against real commits (positive and negative)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/dryrun/source-cases.ps1

  validate-build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      sums-sha256: ${{ steps.manifest.outputs.sums-sha256 }}
      release-files: ${{ steps.manifest.outputs.release-files }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Required-check evidence of the approved commit (stands in for VerifySource)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Import-Module ./scripts/release/ReleaseGuard.psm1 -Force
          Assert-CheckoutHead -ExpectedSha $env:GITHUB_SHA
          ConvertTo-Json -InputObject @(Get-RequiredCheckEvidence -Repository $env:GITHUB_REPOSITORY -Sha '3ef50245922af23cc07ddd07ba03e64e0fc24ab4') -Depth 5 | Set-Content "$env:RUNNER_TEMP/required-checks.json"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Web build dependencies from lockfile
        working-directory: BlazorShop.Presentation/BlazorShop.Web
        run: npm ci --include=dev
      - name: Publish deployable applications
        run: |
          set -euo pipefail
          dotnet publish BlazorShop.Presentation/BlazorShop.API/BlazorShop.API.csproj --configuration Release --output "$RUNNER_TEMP/publish/api"
          dotnet publish BlazorShop.Presentation/BlazorShop.Storefront/BlazorShop.Storefront.csproj --configuration Release --output "$RUNNER_TEMP/publish/storefront"
          dotnet publish BlazorShop.Presentation/BlazorShop.Web/BlazorShop.Web.csproj --configuration Release --output "$RUNNER_TEMP/publish/account"
      - name: Package release archives
        env:
          RELEASE_TAG: v0.0.0-rc.0
        run: |
          set -euo pipefail
          epoch="$(git log -1 --format=%ct)"
          mkdir -p "$RUNNER_TEMP/dist"
          for app in api storefront account; do
            tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
              -C "$RUNNER_TEMP/publish/${app}" -cf - . | gzip -n > "$RUNNER_TEMP/dist/blazorshop-${app}-${RELEASE_TAG}.tar.gz"
          done
      - name: Write provenance and checksums
        id: manifest
        shell: pwsh
        run: ./scripts/release/release-guard.ps1 -Command WriteManifest -Tag 'v0.0.0-rc.0' -Sha $env:GITHUB_SHA -Directory "$env:RUNNER_TEMP/dist" -EvidencePath "$env:RUNNER_TEMP/required-checks.json"
      - name: Verify artifacts before hand-off
        shell: pwsh
        env:
          SUMS_SHA256: ${{ steps.manifest.outputs.sums-sha256 }}
          RELEASE_FILES: ${{ steps.manifest.outputs.release-files }}
        run: |
          ./scripts/release/release-guard.ps1 -Command VerifyArtifacts -Directory "$env:RUNNER_TEMP/dist" -ExpectedSumsSha256 $env:SUMS_SHA256 -ReleaseFiles $env:RELEASE_FILES
          Get-Content "$env:RUNNER_TEMP/dist/SHA256SUMS"
          Get-Content "$env:RUNNER_TEMP/dist/provenance.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ github.run_id }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: release-files-${{ github.run_id }}
          path: ${{ runner.temp }}/dist
      - name: Verify artifacts received from the build job
        shell: pwsh
        env:
          SUMS_SHA256: ${{ needs.validate-build.outputs.sums-sha256 }}
          RELEASE_FILES: ${{ needs.validate-build.outputs.release-files }}
        run: ./scripts/release/release-guard.ps1 -Command VerifyArtifacts -Directory "$env:RUNNER_TEMP/dist" -ExpectedSumsSha256 $env:SUMS_SHA256 -ReleaseFiles $env:RELEASE_FILES
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/provenance.json
      - name: Verify attestations (positive)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GUARD_SOURCE_REF: ${{ github.ref }}
        run: ./scripts/release/release-guard.ps1 -Command VerifyAttestations -Tag 'v0.0.0-rc.0' -Sha $env:GITHUB_SHA -Directory "$env:RUNNER_TEMP/dist"
      - name: Attestation negative cases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release/dryrun/attestation-cases.ps1 -Directory "$env:RUNNER_TEMP/dist"

  publish-draft-dry:
    needs: [validate-build, attest]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/release/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: release-files-${{ github.run_id }}
          path: ${{ runner.temp }}/dist
      - name: Re-verify artifacts and attestations in the publishing job
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SUMS_SHA256: ${{ needs.validate-build.outputs.sums-sha256 }}
          RELEASE_FILES: ${{ needs.validate-build.outputs.release-files }}
          RELEASE_GUARD_SOURCE_REF: ${{ github.ref }}
        run: |
          ./scripts/release/release-guard.ps1 -Command VerifyArtifacts -Directory "$env:RUNNER_TEMP/dist" -ExpectedSumsSha256 $env:SUMS_SHA256 -ReleaseFiles $env:RELEASE_FILES
          ./scripts/release/release-guard.ps1 -Command VerifyAttestations -Tag 'v0.0.0-rc.0' -Sha $env:GITHUB_SHA -Directory "$env:RUNNER_TEMP/dist"
          ./scripts/release/release-guard.ps1 -Command AssertNoRelease -Tag 'v0.0.0-rc.0'
      - name: Hand-off negative cases (swapped archive, foreign manifest hash)
        shell: pwsh
        env:
          SUMS_SHA256: ${{ needs.validate-build.outputs.sums-sha256 }}
          RELEASE_FILES: ${{ needs.validate-build.outputs.release-files }}
        run: ./scripts/release/dryrun/handoff-cases.ps1 -Directory "$env:RUNNER_TEMP/dist"
      - name: Stop before publishing (dry run)
        run: echo "DRY RUN - would run gh release create v0.0.0-rc.0 --draft --verify-tag; not executed, no tag or release exists"

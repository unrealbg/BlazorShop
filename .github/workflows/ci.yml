name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BlazorShop.Presentation/BlazorShop.Web/package-lock.json

      - name: Install Web build dependencies from lockfile
        working-directory: BlazorShop.Presentation/BlazorShop.Web
        run: npm ci --include=dev

      - name: Audit shipped npm runtime dependencies
        working-directory: BlazorShop.Presentation/BlazorShop.Web
        run: |
          mkdir -p ../../artifacts/npm-audit
          npm audit --omit=dev --audit-level=high --json > ../../artifacts/npm-audit/runtime.json

      - name: Audit full npm build dependency tree
        if: always()
        working-directory: BlazorShop.Presentation/BlazorShop.Web
        run: |
          mkdir -p ../../artifacts/npm-audit
          npm audit --include=dev --audit-level=high --json > ../../artifacts/npm-audit/full.json

      - name: Upload full npm audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/npm-audit/*.json
          if-no-files-found: error

      - name: Require zero npm audit findings at every severity
        if: always()
        shell: pwsh
        run: |
          foreach ($report in @('artifacts/npm-audit/runtime.json', 'artifacts/npm-audit/full.json')) {
            $audit = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
            if ($audit.error -or $audit.auditReportVersion -ne 2 -or $null -eq $audit.metadata.vulnerabilities.total) {
              throw "Invalid npm audit report: $report"
            }
            if ($audit.metadata.vulnerabilities.total -ne 0) { throw "npm audit findings remain in $report" }
          }
          Write-Host 'Full and runtime npm audits: zero findings at every severity.'

      - name: Compile and verify Web build toolchain
        run: |
          npm run --prefix BlazorShop.Presentation/BlazorShop.Web tailwind:build
          node scripts/verify-web-build-toolchain.mjs

      - name: Restore
        run: dotnet restore BlazorShop.sln -warnaserror

      - name: Audit full NuGet dependency tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/nuget-audit | Out-Null
          dotnet list BlazorShop.sln package --vulnerable --include-transitive --format json --no-restore > artifacts/nuget-audit/full.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = Get-Content artifacts/nuget-audit/full.json -Raw | ConvertFrom-Json
          if (-not $audit.projects) { throw 'NuGet audit did not return any projects.' }
          if ($audit.problems) { throw 'NuGet audit reported problems; see full.json.' }
          $findings = @($audit.projects | ForEach-Object { $_.frameworks } | ForEach-Object { $_.topLevelPackages; $_.transitivePackages } | Where-Object { $_.vulnerabilities })
          if ($findings.Count -gt 0) { throw "NuGet audit found $($findings.Count) vulnerable packages; see full.json." }
          Write-Host 'NuGet audit: zero vulnerable packages.'

      - name: Upload NuGet audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/nuget-audit/*.json
          if-no-files-found: error

      - name: Build
        run: dotnet build BlazorShop.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test BlazorShop.Tests/BlazorShop.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Report PostgreSQL 17 regression image
        run: docker image inspect postgres:17-alpine --format 'tag=postgres:17-alpine digests={{json .RepoDigests}}'

      - name: Validate production compose config
        env:
          BLAZORSHOP_DB_PASSWORD: ci-db-password
          BLAZORSHOP_JWT_KEY: ci-jwt-signing-key-which-is-long-enough
          BLAZORSHOP_STRIPE_SECRET_KEY: sk_test_placeholder
          BLAZORSHOP_STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          BLAZORSHOP_API_BASE_URL: https://api.shop.example.com
          BLAZORSHOP_CLIENT_APP_BASE_URL: https://account.shop.example.com
          BLAZORSHOP_STOREFRONT_BASE_URL: https://shop.example.com
          BLAZORSHOP_EMAIL_FROM: shop@example.com
          BLAZORSHOP_EMAIL_SMTP_SERVER: smtp.example.com
          BLAZORSHOP_EMAIL_USERNAME: ci@example.com
          BLAZORSHOP_EMAIL_PASSWORD: ci-email-password
        run: docker compose -f compose.production.yml config

      - name: Build API container image
        run: docker build -f BlazorShop.Presentation/BlazorShop.API/Dockerfile -t blazorshop-api:ci .

      - name: Build Storefront container image
        run: docker build -f BlazorShop.Presentation/BlazorShop.Storefront/Dockerfile -t blazorshop-storefront:ci .

      - name: Verify published Storefront static assets
        run: |
          docker run --detach --name storefront-assets --publish 127.0.0.1:18080:8080 \
            --env Api__BaseUrl=https://api.shop.example.com/api/ \
            --env ClientApp__BaseUrl=https://account.shop.example.com/ \
            --env PublicUrl__BaseUrl=https://shop.example.com/ blazorshop-storefront:ci
          trap 'docker logs storefront-assets; docker rm --force storefront-assets' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-connrefused --retry-delay 1 --max-time 5 http://127.0.0.1:18080/ui-v2/hero-chair.svg --output /tmp/storefront-hero.svg
          grep -q 'Modern armchair and side table' /tmp/storefront-hero.svg
          curl --fail --max-time 5 'http://127.0.0.1:18080/css/ui-v2-storefront.css?v=smoke' --output /tmp/storefront-v2.css
          grep -q 'bs-v2-shell' /tmp/storefront-v2.css
          curl --fail --max-time 5 'http://127.0.0.1:18080/css/site.css?v=smoke' --output /tmp/storefront-site.css
          test -s /tmp/storefront-site.css
          cp /tmp/storefront-site.css artifacts/web-build-toolchain/published-storefront.css
          cmp /tmp/storefront-site.css BlazorShop.Presentation/BlazorShop.Web/wwwroot/css/site.css

      - name: Build Web container image
        run: docker build -f BlazorShop.Presentation/BlazorShop.Web/Dockerfile -t blazorshop-web:ci .

      - name: Verify published Web utility CSS
        run: |
          docker create --name web-assets blazorshop-web:ci
          trap 'docker rm --force web-assets' EXIT
          docker cp web-assets:/usr/share/nginx/html/css/site.css /tmp/web-site.css
          test -s /tmp/web-site.css
          cp /tmp/web-site.css artifacts/web-build-toolchain/published-web.css
          cmp /tmp/web-site.css artifacts/web-build-toolchain/web-only.css

      - name: Upload Tailwind CSS and compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-toolchain-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/web-build-toolchain
          if-no-files-found: error

  browser-e2e:
    if: github.event_name != 'pull_request' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: BlazorShop.Presentation/BlazorShop.Web/package-lock.json

      - name: Install Web build dependencies from lockfile
        working-directory: BlazorShop.Presentation/BlazorShop.Web
        run: npm ci --include=dev

      - name: Restore browser E2E project
        run: dotnet restore BlazorShop.E2E/BlazorShop.E2E.csproj

      - name: Build browser E2E project
        run: >-
          dotnet build BlazorShop.E2E/BlazorShop.E2E.csproj
          --configuration Release
          --no-restore
          -warnaserror

      - name: Create development HTTPS certificate
        run: dotnet dev-certs https

      - name: Initialize E2E diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/e2e | Out-Null
          @(
            "dotnet=$(dotnet --version)"
            "node=$(node --version)"
            "playwright=1.61.0"
            "chromium=149.0.7827.55"
            "postgres=16.13-alpine3.23"
          ) | Set-Content artifacts/e2e/environment.txt

      - name: Install Playwright Chromium and operating-system dependencies
        run: >-
          pwsh scripts/install-playwright-chromium.ps1
          -InstallerPath BlazorShop.E2E/bin/Release/net10.0/playwright.ps1

      - name: Run browser E2E suite (first consecutive run)
        shell: pwsh
        env:
          BLAZORSHOP_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/e2e/run-1
        run: |
          $logPath = "artifacts/e2e/run-1/application-output.log"
          New-Item -ItemType Directory -Force -Path (Split-Path $logPath) | Out-Null
          & dotnet test BlazorShop.E2E/BlazorShop.E2E.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --logger "trx;LogFileName=e2e-run-1.trx" `
            --results-directory artifacts/e2e/test-results/run-1 `
            --verbosity normal 2>&1 | Tee-Object -FilePath $logPath
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }
          if ((Get-Item $logPath).Length -eq 0) { throw "The E2E application log is empty." }
          foreach ($resource in @("apiservice", "storefront", "adminclient", "postgres")) {
            if (-not (Select-String -Path $logPath -Pattern "BlazorShop.AppHost.Resources.$resource" -SimpleMatch -Quiet)) {
              throw "The E2E application log is missing output for resource '$resource'."
            }
          }

      - name: Verify mandatory browser scenarios (first run)
        shell: pwsh
        run: >-
          ./scripts/verify-e2e-results.ps1
          -Path artifacts/e2e/test-results/run-1/e2e-run-1.trx

      - name: Run browser E2E suite (second consecutive run)
        shell: pwsh
        env:
          BLAZORSHOP_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/e2e/run-2
        run: |
          $logPath = "artifacts/e2e/run-2/application-output.log"
          New-Item -ItemType Directory -Force -Path (Split-Path $logPath) | Out-Null
          & dotnet test BlazorShop.E2E/BlazorShop.E2E.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --logger "trx;LogFileName=e2e-run-2.trx" `
            --results-directory artifacts/e2e/test-results/run-2 `
            --verbosity normal 2>&1 | Tee-Object -FilePath $logPath
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }
          if ((Get-Item $logPath).Length -eq 0) { throw "The E2E application log is empty." }
          foreach ($resource in @("apiservice", "storefront", "adminclient", "postgres")) {
            if (-not (Select-String -Path $logPath -Pattern "BlazorShop.AppHost.Resources.$resource" -SimpleMatch -Quiet)) {
              throw "The E2E application log is missing output for resource '$resource'."
            }
          }

      - name: Verify mandatory browser scenarios (second run)
        shell: pwsh
        run: >-
          ./scripts/verify-e2e-results.ps1
          -Path artifacts/e2e/test-results/run-2/e2e-run-2.trx

      - name: Report E2E PostgreSQL image
        run: >-
          docker image inspect postgres:16.13-alpine3.23
          --format 'tag={{index .RepoTags 0}} digests={{json .RepoDigests}}'

      - name: Upload browser E2E reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/e2e
          if-no-files-found: error
          retention-days: 14

  postgres16-archive:
    runs-on: ubuntu-latest
    env:
      BLAZORSHOP_TEST_POSTGRES_IMAGE: postgres:16.13-alpine3.23

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BlazorShop.sln

      - name: Build archive tests
        run: dotnet build BlazorShop.Tests/BlazorShop.Tests.csproj --configuration Release --no-restore

      - name: Test archive migration on PostgreSQL 16
        run: >-
          dotnet test BlazorShop.Tests/BlazorShop.Tests.csproj
          --configuration Release
          --no-build
          --filter "FullyQualifiedName~LegacyCheckoutArchive"
          --verbosity normal

      - name: Report PostgreSQL 16 Compose image
        run: >-
          docker image inspect "$BLAZORSHOP_TEST_POSTGRES_IMAGE"
          --format 'tag={{index .RepoTags 0}} digests={{json .RepoDigests}}'

name: R09 Final OCI Signed Stripe Rehearsal

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  REHEARSAL_TARGET_SHA: 750e3df37ffd430ae03697339e8dad9d6989d8f5

jobs:
  upgrade-restore-rehearsal:
    name: Signed fake Stripe rehearsal (${{ matrix.baseline }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        baseline: [historical, candidate-f40b870]
    env:
      REHEARSAL_BASELINE_PROFILE: ${{ matrix.baseline }}

    steps:
      - name: Checkout rehearsal tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false

      - name: Resolve baseline from the reviewed profile
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          profile_file="tooling/rehearsal/baselines/${REHEARSAL_BASELINE_PROFILE}.env"
          if [[ ! -f "$profile_file" ]]; then
            echo "Baseline profile '${REHEARSAL_BASELINE_PROFILE}' is BLOCKED: $profile_file does not exist." >&2
            exit 1
          fi
          sha="$(sed -n 's/^BASELINE_SHA=//p' "$profile_file" | tr -d '\r')"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Baseline profile '${REHEARSAL_BASELINE_PROFILE}' has no valid BASELINE_SHA." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact baseline application version
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: application-baseline
          persist-credentials: false

      - name: Checkout exact target application version
        uses: actions/checkout@v6
        with:
          ref: ${{ env.REHEARSAL_TARGET_SHA }}
          path: application-target
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: r09-target-oci-42500204918-1
          run-id: 42500204918
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r09-target-oci

      - name: Install the OCI archive importer
        shell: bash
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends skopeo
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: application-target/global.json

      - name: Record hosted runner and SDK evidence
        shell: bash
        working-directory: tooling
        run: |
          mkdir -p artifacts/staging-rehearsal/reports
          {
            echo "runner_image=ubuntu-24.04"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            dotnet --info
          } > artifacts/staging-rehearsal/reports/host-tooling.txt

      - name: Restore attach-only browser project
        working-directory: tooling
        run: dotnet restore BlazorShop.StagingRehearsal/BlazorShop.StagingRehearsal.csproj

      - name: Build attach-only browser project
        working-directory: tooling
        run: >-
          dotnet build BlazorShop.StagingRehearsal/BlazorShop.StagingRehearsal.csproj
          --configuration Release
          --no-restore
          -warnaserror

      - name: Record browser test package versions
        working-directory: tooling
        run: >-
          dotnet list BlazorShop.StagingRehearsal/BlazorShop.StagingRehearsal.csproj
          package
          --include-transitive
          > artifacts/staging-rehearsal/reports/browser-packages.txt

      - name: Install matching Playwright Chromium and system dependencies
        working-directory: tooling
        run: >-
          pwsh scripts/install-playwright-chromium.ps1
          -InstallerPath BlazorShop.StagingRehearsal/bin/Release/net10.0/playwright.ps1

      - name: Run isolated upgrade and restore rehearsal
        shell: bash
        working-directory: tooling
        run: |
          mkdir -p artifacts/staging-rehearsal/logs
          set +e
          bash rehearsal/run-staging-rehearsal.sh \
            . ../application-baseline ../application-target "$RUNNER_TEMP/r09-target-oci" \
            2>&1 | tee artifacts/staging-rehearsal/logs/runner.log
          rehearsal_exit=${PIPESTATUS[0]}
          exit "$rehearsal_exit"

      - name: Upload sanitized rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r09-signed-stripe-${{ matrix.baseline }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: tooling/artifacts/staging-rehearsal
          if-no-files-found: error
          retention-days: 14

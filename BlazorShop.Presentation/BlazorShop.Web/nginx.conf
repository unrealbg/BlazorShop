map $http_x_forwarded_proto $upstream_proto {
    default $scheme;
    https https;
}

# This container is intended to sit behind a public TLS terminator.
# Keep TLS, HSTS, and 80 -> 443 redirects on the external edge, not on this private hop.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # nginx inherits add_header only into locations that define no add_header of their own.
    # Every location below that sets a header must include this file again (see RC audit R04).
    include /etc/nginx/snippets/blazorshop-security-headers.conf;

    location = /storefront {
        return 302 ${BLAZORSHOP_STOREFRONT_BASE_URL};
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    location = /health {
        proxy_pass http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    location = /alive {
        proxy_pass http://api:8080/alive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    location = /index.html {
        include /etc/nginx/snippets/blazorshop-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(css|js)$ {
        include /etc/nginx/snippets/blazorshop-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

services:
  postgres:
    image: ${REHEARSAL_POSTGRES_IMAGE:?REHEARSAL_POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: ${REHEARSAL_DB_NAME:?REHEARSAL_DB_NAME is required}
      POSTGRES_USER: ${REHEARSAL_DB_USER:?REHEARSAL_DB_USER is required}
      POSTGRES_PASSWORD: ${REHEARSAL_DB_PASSWORD:?REHEARSAL_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - primary-postgres-data:/var/lib/postgresql/data
    networks:
      - rehearsal

  restore-postgres:
    profiles: ["restore"]
    image: ${REHEARSAL_POSTGRES_IMAGE:?REHEARSAL_POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: ${REHEARSAL_DB_NAME:?REHEARSAL_DB_NAME is required}
      POSTGRES_USER: ${REHEARSAL_DB_USER:?REHEARSAL_DB_USER is required}
      POSTGRES_PASSWORD: ${REHEARSAL_DB_PASSWORD:?REHEARSAL_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - restore-postgres-data:/var/lib/postgresql/data
    networks:
      - rehearsal

  api:
    image: ${REHEARSAL_API_IMAGE:?REHEARSAL_API_IMAGE is required}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=${REHEARSAL_DB_HOST:-postgres};Port=5432;Database=${REHEARSAL_DB_NAME};Username=${REHEARSAL_DB_LOGIN_USER:-${REHEARSAL_DB_USER}};Password=${REHEARSAL_DB_PASSWORD}
      Jwt__Key: ${REHEARSAL_JWT_KEY:?REHEARSAL_JWT_KEY is required}
      Jwt__Issuer: ${REHEARSAL_WEB_URL:?REHEARSAL_WEB_URL is required}
      Jwt__Audience: ${REHEARSAL_WEB_URL:?REHEARSAL_WEB_URL is required}
      ClientApp__BaseUrl: ${REHEARSAL_WEB_URL:?REHEARSAL_WEB_URL is required}
      Identity__RequireConfirmedAccount: "false"
      Identity__RequireConfirmedEmail: ${REHEARSAL_REQUIRE_CONFIRMED_EMAIL:-false}
      Stripe__Enabled: "false"
      Stripe__SecretKey: ""
      Stripe__WebhookSecret: ${REHEARSAL_STRIPE_WEBHOOK_SECRET:-}
      Demo__Enabled: "false"
      EmailSettings__Enabled: ${REHEARSAL_EMAIL_ENABLED:-false}
      EmailSettings__From: rehearsal@example.test
      EmailSettings__DisplayName: Rehearsal
      EmailSettings__SmtpServer: mailpit
      EmailSettings__Port: "1025"
      EmailSettings__UseSsl: "false"
      EmailSettings__Username: rehearsal
      EmailSettings__Password: ${REHEARSAL_SMTP_PASSWORD:?REHEARSAL_SMTP_PASSWORD is required}
      RegistrationConfirmation__PollSeconds: "1"
      Runtime__Cors__AllowedOrigins__0: ${REHEARSAL_WEB_URL:?REHEARSAL_WEB_URL is required}
      Runtime__ForwardedHeaders__Enabled: ${REHEARSAL_FORWARD_HEADERS:-false}
      Runtime__ForwardedHeaders__KnownProxies__0: ${REHEARSAL_EDGE_IP:-127.0.0.1}
      ASPNETCORE_HTTPS_PORT: ${REHEARSAL_EDGE_PORT:-443}
      Runtime__Health__ExposeInProduction: "true"
      Runtime__Security__EnableHsts: "false"
      Runtime__Security__EnableHttpsRedirection: ${REHEARSAL_FORCE_HTTPS:-false}
      Runtime__Security__RefreshTokenCookieName: blazorshop-rehearsal-refresh
      Runtime__Security__RefreshTokenCookieSameSite: Lax
      Runtime__RateLimiting__Enabled: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REHEARSAL_API_PORT:?REHEARSAL_API_PORT is required}:8080"
    volumes:
      # Primary volumes by default; the restored baseline switches to the restore-* volumes.
      - ${REHEARSAL_UPLOADS_VOLUME:-uploads-data}:/app/uploads
      - ${REHEARSAL_DATA_PROTECTION_VOLUME:-data-protection-keys}:/root/.aspnet/DataProtection-Keys
    networks:
      - rehearsal

  storefront:
    image: ${REHEARSAL_STOREFRONT_IMAGE:?REHEARSAL_STOREFRONT_IMAGE is required}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Api__BaseUrl: http://api:8080/api/
      ClientApp__BaseUrl: ${REHEARSAL_WEB_URL:?REHEARSAL_WEB_URL is required}
      PublicUrl__BaseUrl: ${REHEARSAL_STOREFRONT_URL:?REHEARSAL_STOREFRONT_URL is required}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${REHEARSAL_STOREFRONT_PORT:?REHEARSAL_STOREFRONT_PORT is required}:8080"
    networks:
      - rehearsal

  web:
    image: ${REHEARSAL_WEB_IMAGE:?REHEARSAL_WEB_IMAGE is required}
    environment:
      BLAZORSHOP_STOREFRONT_BASE_URL: ${REHEARSAL_STOREFRONT_URL:?REHEARSAL_STOREFRONT_URL is required}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${REHEARSAL_WEB_PORT:?REHEARSAL_WEB_PORT is required}:80"
    networks:
      - rehearsal

  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.27.4
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${REHEARSAL_MAIL_PORT:?REHEARSAL_MAIL_PORT is required}:8025"
    networks:
      - rehearsal

  edge:
    profiles: ["edge"]
    image: ${REHEARSAL_EDGE_IMAGE:?REHEARSAL_EDGE_IMAGE is required}
    ports:
      - "127.0.0.1:${REHEARSAL_EDGE_PORT:?REHEARSAL_EDGE_PORT is required}:443"
    volumes:
      - ${REHEARSAL_EDGE_DIR:?REHEARSAL_EDGE_DIR is required}:/edge:ro
      - ${REHEARSAL_EDGE_DIR}/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - rehearsal

  # Idle helper with no network. The runner streams fixtures, manifests and archives through
  # `docker compose exec`, so only this run's project volumes are ever read or written.
  volume-tool:
    profiles: ["tools"]
    image: ${REHEARSAL_POSTGRES_IMAGE:?REHEARSAL_POSTGRES_IMAGE is required}
    entrypoint: ["tail", "-f", "/dev/null"]
    network_mode: none
    volumes:
      - uploads-data:/volumes/primary/uploads
      - data-protection-keys:/volumes/primary/data-protection-keys
      - restore-uploads-data:/volumes/restore/uploads
      - restore-data-protection-keys:/volumes/restore/data-protection-keys

  # Idle ASP.NET Core runtime with no network for the Data Protection probe.
  data-protection-probe:
    profiles: ["tools"]
    image: ${REHEARSAL_PROBE_IMAGE:?REHEARSAL_PROBE_IMAGE is required}
    entrypoint: ["tail", "-f", "/dev/null"]
    network_mode: none
    volumes:
      - data-protection-keys:/keys/primary
      - restore-data-protection-keys:/keys/restore
      - ${REHEARSAL_PROBE_DIR:?REHEARSAL_PROBE_DIR is required}:/probe:ro

volumes:
  primary-postgres-data:
  restore-postgres-data:
  uploads-data:
  data-protection-keys:
  restore-uploads-data:
  restore-data-protection-keys:

networks:
  rehearsal:

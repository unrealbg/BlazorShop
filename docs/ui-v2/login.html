<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlazorShop v2 — Sign in</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell" style="min-height:100vh;display:grid;grid-template-rows:auto 1fr"><header class="topbar"><div class="container topbar-main"><a class="brand" href="index.html">Blazor<span>Shop</span></a><div></div><a class="muted" href="index.html">← Back to store</a></div></header><main style="display:grid;place-items:center;padding:40px 16px;background:radial-gradient(circle at 15% 10%,#dbeafe,transparent 30%),radial-gradient(circle at 85% 90%,#ede9fe,transparent 30%),#f8fafc"><section class="panel" style="width:min(100%,460px);padding:30px"><div class="eyebrow">Account</div><h1 style="font-size:2rem;margin:.35rem 0 8px">Sign in to BlazorShop</h1><p class="muted" style="margin-top:0">Access your orders, profile and notifications.</p><div class="field" style="margin-top:20px"><label>Email</label><input placeholder="you@example.com"></div><div class="field" style="margin-top:14px"><label>Password</label><input type="password" placeholder="••••••••"></div><div style="display:flex;justify-content:space-between;gap:12px;margin:14px 0;font-size:.82rem"><label class="check" style="margin:0"><input type="checkbox"> Remember me</label><a href="#" style="color:var(--bs-primary);font-weight:700">Forgot password?</a></div><button class="btn btn-primary full">Sign in</button><div style="display:flex;align-items:center;gap:10px;margin:20px 0;color:#94a3b8;font-size:.78rem"><span style="height:1px;background:var(--bs-line);flex:1"></span>OR<span style="height:1px;background:var(--bs-line);flex:1"></span></div><button class="btn btn-secondary full">Create account</button><div class="notice notice-warning" style="margin-top:18px"><strong>Admin bootstrap is separate.</strong><br>Public registration must never grant Admin. The admin account is created through the explicit bootstrap mechanism from #87.</div></section></main></div></body></html>

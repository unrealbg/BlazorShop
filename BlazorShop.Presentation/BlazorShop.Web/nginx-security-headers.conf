# Shared response security headers for the Web (WebAssembly workspace) nginx host.
# Included at server level and again in every location that declares its own add_header,
# because such a location stops inheriting server-level add_header directives.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
